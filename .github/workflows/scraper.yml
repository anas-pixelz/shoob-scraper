name: Shoob Scraper

on:
  workflow_dispatch:

  # Run automatically every 30 minutes.
  # Each run processes one batch and then exits.
  schedule:
  - cron: "0,30 * * * *"


# Prevent two scraper instances from
# running against MongoDB at the same time.
concurrency:
  group: shoob-scraper
  cancel-in-progress: false


jobs:

  scrape:

    runs-on: ubuntu-latest

    # Prevent a single batch from running forever.
    timeout-minutes: 110

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt


      # ======================================================
      # CHROME VERSION
      # ======================================================

      - name: Check Chrome version
        run: |
          echo "Installed Chrome:"
          google-chrome --version || true

          echo "Installed Chromium:"
          chromium --version || true


      # ======================================================
      # RUN SCRAPER
      # ======================================================

      - name: Run Shoob scraper
        env:

          # MongoDB
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}

          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}

          # Scraper
          BASE_URL: "https://shoob.gg/cards?page="

          START_PAGE: "70"

          MAX_PAGE: "2404"

          BATCH_SIZE: "30"

          PAGE_LOAD_TIMEOUT: "20"

          GALLERY_WAIT: "4"

          DETAIL_WAIT: "15"

          DETAIL_EXTRA_WAIT: "1"

          HEADLESS: "true"

          SKIP_EXISTING: "true"

          MONGODB_STATE_COLLECTION: "scraper_state"

          RESET_PROGRESS: "false"

        run: |
          python shoob_scraper.py