name: Shoob Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            pymongo \
            python-dotenv \
            beautifulsoup4 \
            selenium \
            undetected-chromedriver

      - name: Run Shoob scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

          MONGODB_DATABASE: shoob
          MONGODB_COLLECTION: cards
          MONGODB_STATE_COLLECTION: scraper_state

          BASE_URL: https://shoob.gg/cards?page=

          # Initial starting point.
          # After this, MongoDB controls the resume position.
          START_PAGE: 1

          # Maximum page.
          END_PAGE: 2404

          # IMPORTANT:
          # Only process 30 pages during this run.
          BATCH_SIZE: 30

          PAGE_LOAD_TIMEOUT: 30
          GALLERY_WAIT: 4
          DETAIL_WAIT: 20
          DETAIL_EXTRA_WAIT: 1

          HEADLESS: "true"
          SKIP_EXISTING: "true"
          RESET_PROGRESS: "false"

        run: |
          python shoob_scraper.py