name: Shoob Scraper

on:
  workflow_dispatch:

  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            xvfb

      # ==========================================
      # PYTHON PACKAGES
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            pymongo \
            python-dotenv \
            beautifulsoup4 \
            selenium \
            undetected-chromedriver

      # ==========================================
      # RUN SCRAPER
      # ==========================================
      - name: Run Shoob scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

          MONGODB_DATABASE: shoob

          MONGODB_COLLECTION: cards

          MONGODB_STATE_COLLECTION: scraper_state

          BASE_URL: https://shoob.gg/cards?page=

          START_PAGE: 1

          END_PAGE: 2403

          PAGE_LOAD_TIMEOUT: 30

          GALLERY_WAIT: 4

          DETAIL_WAIT: 20

          DETAIL_EXTRA_WAIT: 1

          HEADLESS: "true"

          SKIP_EXISTING: "true"

          RESET_PROGRESS: "false"

        run: |
          python shoob_scraper.py